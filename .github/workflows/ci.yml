# 守门链 CI：每次 push / main 收 PR 时在干净环境跑 typecheck + 全量单测。
# 判据与本地一致：无任何 API 凭证也必须全绿（2026-09-14 P0-1 修复后的承诺）。
# runner 选 windows-latest：开发在 Windows，路径分隔符 / CRLF / 编码类问题只在 Windows 暴露。
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        env:
          # 空串凭证 = 保险丝：任何用例若真的尝试构造 API client 会立即抛错，
          # 而不是静默打出真实调用。全部测试都应只依赖 fixture / ReplayProvider。
          DEEPSEEK_API_KEY: ""
          OPENAI_API_KEY: ""
        shell: bash
        run: npm test > test-output.txt 2>&1

      # 日志接口需鉴权，失败细节写进 run summary（公开页面匿名可读），CI 值夜班自报告
      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          {
            echo "### Tests 失败诊断"
            if [ -f test-output.txt ] && grep -q "^not ok" test-output.txt; then
              echo '```'
              grep -B 2 -A 25 "^not ok" test-output.txt | head -400
              echo '```'
            elif [ -f test-output.txt ]; then
              echo '```'
              tail -80 test-output.txt
              echo '```'
            else
              echo "test-output.txt 未生成（进程早期崩溃）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
